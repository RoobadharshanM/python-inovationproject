<div class="col-12 col-xl-{{ width|default:'6' }} chart-column">
  <article class="glass-card chart-card h-100" data-chart-card="{{ chart_id }}">
    <header class="chart-card-header">
      <div>
        <p class="chart-kicker mb-1">{{ kicker|default:'Performance' }}</p>
        <h2 class="chart-title">{{ title }}</h2>
        {% if subtitle %}<p class="chart-subtitle mb-0">{{ subtitle }}</p>{% endif %}
      </div>
      <span class="chart-status" data-chart-status aria-hidden="true"><span class="status-dot"></span>Live data</span>
    </header>
    <div class="chart-container{% if height %} chart-container-{{ height }}{% endif %}" data-chart-container>
      <canvas id="{{ chart_id }}" role="img" aria-label="{{ title }}{% if subtitle %}: {{ subtitle }}{% endif %}"></canvas>
      <div class="chart-empty" data-chart-empty hidden>
        <i class="bi bi-bar-chart-line" aria-hidden="true"></i>
        <span>No data available for this view</span>
      </div>
    </div>
  </article>
</div>
